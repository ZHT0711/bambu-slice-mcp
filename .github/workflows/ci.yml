name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Syntax check
        run: |
          for f in src/*.js test/*.js; do node --check "$f"; done
      - name: Modules load
        run: node -e "Promise.all([import('./src/profiles.js'), import('./src/slicer.js')]).then(() => console.log('ok'))"
